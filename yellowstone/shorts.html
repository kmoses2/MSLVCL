<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>옐로스톤 쇼츠</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; background:#0b0b0d; color:#f2efe9; font-family:"Noto Sans KR",system-ui,sans-serif; }
  main { max-width:440px; margin:0 auto; padding:16px; }
  .stage { position:relative; width:100%; aspect-ratio:9/16; background:#000; border-radius:14px; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  .bigplay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.35); border:0; color:#fff; font-size:64px; cursor:pointer; }
  .bigplay[hidden] { display:none; }
  .controls { display:flex; gap:10px; align-items:center; margin-top:10px; }
  .controls button { background:#16161a; color:#f2efe9; border:1px solid #2a2a30; border-radius:8px; padding:8px 12px; font:inherit; font-size:14px; cursor:pointer; }
  .controls input { flex:1; accent-color:#ff8a2a; }
  body.render main { padding:0; max-width:none; }
  body.render .controls, body.render .bigplay { display:none; }
  body.render .stage { width:1080px; height:1920px; border-radius:0; }
</style>
</head>
<body>
<main>
  <div class="stage"><canvas id="c" width="1080" height="1920"></canvas><button class="bigplay" id="bigplay" aria-label="재생">▶</button></div>
  <div class="controls"><button id="play">▶</button><input type="range" id="seek" min="0" max="30" step="0.01" value="0" aria-label="재생 위치"></div>
</main>
<script>
"use strict";
const W = 1080, H = 1920, TOTAL = 30;
const out = document.getElementById('c'), octx = out.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const bufA = mk(), bufB = mk();
let ctx = octx;
const FONT = '"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const R = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const TAU = Math.PI * 2;

function fillRect(c, x = 0, y = 0, w = W, h = H) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function vgrad(y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function glow(x, y, r, color, alpha = 1) {
  if (alpha <= 0 || r <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.restore();
}
function puff(x, y, r, a, c = '255,255,255') {
  if (a <= 0 || r <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(1, `rgba(${c},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function cam(cx, cy, s, rot = 0, dx = 0, dy = 0) { ctx.translate(cx + dx, cy + dy); ctx.scale(s, s); ctx.rotate(rot); ctx.translate(-cx, -cy); }
function shake(t, amp, seed = 0) { const k = Math.floor(t * 30); ctx.translate((R(k + seed) - .5) * amp, (R(k + seed + 99) - .5) * amp); }
function ridge(y0, amp, seed, color, freq = 1, x0 = -200, x1 = W + 200) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x0, H * 2);
  for (let x = x0; x <= x1; x += 16) ctx.lineTo(x, y0 - amp * (.5 * Math.sin(x * .006 * freq + seed) + .3 * Math.sin(x * .015 * freq + seed * 2.3) + .2 * Math.sin(x * .031 * freq + seed * 5.1)));
  ctx.lineTo(x1, H * 2); ctx.closePath(); ctx.fill();
}
function blobPath(cx, cy, r, seed, wob = .07, sy = 1) {
  ctx.beginPath();
  for (let k = 0; k <= 120; k++) {
    const th = k / 120 * TAU, rr = r * (1 + wob * Math.sin(3 * th + seed) + wob * .6 * Math.sin(7 * th + seed * 2) + wob * .3 * Math.sin(13 * th + seed * 3));
    const x = cx + Math.cos(th) * rr, y = cy + Math.sin(th) * rr * sy; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function txt(str, x, y, { size = 60, weight = 900, color = '#fff', alpha = 1, stroke = 0, align = 'center', shadow = true, scale = 1 } = {}) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = size * .3; ctx.shadowOffsetY = size * .05; }
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = '#000'; ctx.strokeText(str, 0, 0); ctx.shadowColor = 'transparent'; }
  ctx.fillStyle = color; ctx.fillText(str, 0, 0); ctx.restore();
}
function pill(str, x, y, { size = 40, alpha = 1, bg = 'rgba(0,0,0,.6)', border = null, scale = 1 } = {}) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.font = `800 ${size}px ${FONT}`;
  const w = ctx.measureText(str).width + size * 1.3, h = size * 1.8;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  if (border) { ctx.strokeStyle = border; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(str, 0, 2); ctx.restore();
}
function arrow(x1, y1, x2, y2, color = '#fff', w = 5, head = 24) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * head * .6, y2 - Math.sin(a) * head * .6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - Math.cos(a - .45) * head, y2 - Math.sin(a - .45) * head); ctx.lineTo(x2 - Math.cos(a + .45) * head, y2 - Math.sin(a + .45) * head); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function pine(x, y, h, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x, y - h); ctx.lineTo(x + h * .22, y); ctx.lineTo(x - h * .22, y); ctx.closePath(); ctx.fill(); }
function stars(n, seed) { ctx.save(); ctx.fillStyle = '#fff'; for (let i = 0; i < n; i++) { ctx.globalAlpha = .2 + .8 * R(seed + i * 3.1); ctx.fillRect(R(seed + i) * W, R(seed + i * 1.7) * H, 2, 2); } ctx.restore(); }

const PRISM = [[1.0, '#6e3412'], [.9, '#a9481a'], [.8, '#d26a1f'], [.7, '#e69a33'], [.61, '#e9c64e'], [.53, '#bcc96c'], [.46, '#5fb0a0'], [.39, '#2b93c2'], [.28, '#176fb0'], [.16, '#0c4f8f']];
function prismatic(cx, cy, R0, t, sy = 1) {
  ctx.save();
  for (let i = 0; i < 30; i++) {
    const a = R(i + 40) * TAU, len = R0 * (.4 + R(i + 41) * .8);
    ctx.strokeStyle = `rgba(${200 + R(i) * 40 | 0},${90 + R(i + 1) * 50 | 0},30,.55)`; ctx.lineWidth = 8 + R(i + 2) * 16;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * R0 * .9, cy + Math.sin(a) * R0 * .9 * sy);
    ctx.quadraticCurveTo(cx + Math.cos(a + .15) * (R0 + len * .5), cy + Math.sin(a + .15) * (R0 + len * .5) * sy, cx + Math.cos(a + .05) * (R0 + len), cy + Math.sin(a + .05) * (R0 + len) * sy);
    ctx.stroke();
  }
  PRISM.forEach(([k, c], i) => { blobPath(cx, cy, R0 * k, 1.3 + i * .2, .05 - i * .003, sy); ctx.fillStyle = c; ctx.fill(); });
  ctx.globalAlpha = .22 + .06 * Math.sin(t * 3); blobPath(cx, cy, R0 * .38, 4, .04, sy);
  const g = ctx.createRadialGradient(cx - R0 * .1, cy - R0 * .1 * sy, 0, cx, cy, R0 * .4); g.addColorStop(0, '#d8f3ff'); g.addColorStop(1, 'rgba(0,80,160,0)');
  ctx.fillStyle = g; ctx.fill(); ctx.restore();
}
function steamField(cx, cy, spread, t, n = 40, scale = 1, alpha = .35) {
  for (let i = 0; i < n; i++) {
    const life = 5 + R(i) * 3, age = (t + R(i + 9) * life) % life, f = age / life;
    puff(cx + (R(i + 3) - .5) * spread + age * (50 + R(i + 5) * 40) * scale, cy + (R(i + 4) - .5) * spread * .5 - age * (90 + R(i + 6) * 60) * scale, (70 + f * 220) * scale, alpha * Math.sin(f * Math.PI));
  }
}
function geyser(x, base, t, strength, scale = 1, n = 300) {
  if (strength <= 0) return;
  ctx.save();
  const ch = 560 * strength * scale, cg = ctx.createLinearGradient(0, base, 0, base - ch);
  cg.addColorStop(0, 'rgba(240,248,255,.9)'); cg.addColorStop(.7, 'rgba(230,242,252,.5)'); cg.addColorStop(1, 'rgba(230,242,252,0)');
  ctx.fillStyle = cg; ctx.beginPath(); ctx.moveTo(x - 16 * scale, base);
  for (let k = 0; k <= 10; k++) ctx.lineTo(x - (16 + k * 9) * scale + Math.sin(t * 9 + k) * 4 * scale, base - ch * k / 10);
  for (let k = 10; k >= 0; k--) ctx.lineTo(x + (16 + k * 9) * scale + Math.sin(t * 8 + k * 1.3) * 4 * scale, base - ch * k / 10);
  ctx.closePath(); ctx.fill();
  for (let i = 0; i < n; i++) {
    const life = 1.6 + R(i) * 1.4, age = (t + R(i + 1) * life) % life;
    const v = (700 + R(i + 2) * 600) * strength * scale, g = 520 * scale, y = base - (v * age - .5 * g * age * age);
    if (y > base) continue;
    const xx = x + (R(i + 3) - .5) * 30 * scale + (R(i + 4) - .5) * 160 * age * scale + age * age * 30 * scale;
    ctx.globalAlpha = .55 * (1 - age / life); ctx.fillStyle = R(i + 5) > .3 ? '#eef7ff' : '#bcdcf0';
    const s = (3 + R(i + 6) * 6) * scale * (1 + age); ctx.fillRect(xx - s / 2, y - s / 2, s, s);
  }
  ctx.restore();
  for (let i = 0; i < 24; i++) {
    const life = 4, age = (t + R(i + 70) * life) % life, f = age / life, top = base - 520 * strength * scale;
    puff(x + (R(i + 71) - .3) * 120 * scale + age * 60 * scale, top + 120 * scale - age * 70 * scale + R(i) * 200 * scale, (50 + f * 150) * scale, .4 * strength * Math.sin(f * Math.PI));
  }
}
function bison(x, y, s, ph, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = color;
  for (let k = 0; k < 4; k++) { const lx = [-45, -30, 38, 52][k], a = Math.sin(ph + (k % 2 ? Math.PI : 0) + (k > 1 ? .8 : 0)) * .32; ctx.save(); ctx.translate(lx, -2); ctx.rotate(a); ctx.fillRect(-5, 0, 10, 32); ctx.restore(); }
  ctx.beginPath(); ctx.moveTo(-62, -18); ctx.bezierCurveTo(-64, -44, -30, -50, 0, -48); ctx.bezierCurveTo(22, -74, 48, -74, 58, -52);
  ctx.bezierCurveTo(70, -46, 80, -30, 84, -10); ctx.lineTo(86, 2); ctx.lineTo(72, 8); ctx.bezierCurveTo(64, 14, 54, 10, 48, 4); ctx.lineTo(-56, 4); ctx.bezierCurveTo(-66, 0, -66, -10, -62, -18); ctx.fill();
  ctx.restore();
}
function magmaBlob(cx, cy, r, t, sy = 1) {
  glow(cx, cy, r * 1.9, 'rgba(255,90,20,.6)', .85 + .15 * Math.sin(t * 4));
  blobPath(cx, cy, r * (1 + .02 * Math.sin(t * 3)), 2 + t * .3, .09, sy);
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, '#fff1a8'); g.addColorStop(.35, '#ffb03a'); g.addColorStop(.75, '#ff5a1a'); g.addColorStop(1, '#8a1a08');
  ctx.fillStyle = g; ctx.fill();
  ctx.save(); blobPath(cx, cy, r, 2 + t * .3, .09, sy); ctx.clip();
  ctx.strokeStyle = 'rgba(80,10,0,.35)'; ctx.lineWidth = 6;
  for (let i = 0; i < 9; i++) { ctx.beginPath(); for (let k = 0; k <= 20; k++) { const x = cx - r + k * r / 10, y = cy + (i - 4) * r * .22 * sy + Math.sin(k * .8 + i + t * 2) * 14; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); }
  ctx.restore();
}
function embers(cx, cy, spread, t, n = 50) {
  for (let i = 0; i < n; i++) { const f = (t * (.3 + R(i) * .3) + R(i + 1)) % 1; ctx.fillStyle = `rgba(255,${150 + R(i + 2) * 90 | 0},60,${1 - f})`; ctx.beginPath(); ctx.arc(cx + (R(i + 3) - .5) * spread + Math.sin(t * 2 + i) * 20, cy - f * spread * 1.2, 3 + R(i + 4) * 5, 0, TAU); ctx.fill(); }
}

/* ---------- map data ---------- */
const STATES = {
  '오리건': [[-124.5, 42], [-117.03, 42], [-117.03, 43.8], [-116.9, 44.2], [-117.2, 44.3], [-116.5, 45.6], [-116.9, 46], [-119, 46], [-121, 45.6], [-124, 46.2]],
  '아이다호': [[-117.03, 49], [-116.05, 49], [-116.05, 47.98], [-115.72, 47.42], [-114.33, 46.66], [-114.5, 45.56], [-113.45, 44.86], [-112.84, 44.36], [-111.05, 44.48], [-111.05, 42], [-117.03, 42], [-117.03, 43.8], [-116.9, 44.2], [-117.2, 44.3], [-116.5, 45.6], [-116.9, 46], [-117.03, 46.4]],
  '몬태나': [[-116.05, 49], [-104.05, 49], [-104.05, 45], [-111.05, 45], [-111.05, 44.48], [-112.84, 44.36], [-113.45, 44.86], [-114.5, 45.56], [-114.33, 46.66], [-115.72, 47.42], [-116.05, 47.98]],
  '와이오밍': [[-111.05, 45], [-104.05, 45], [-104.05, 41], [-111.05, 41]],
  '네바다': [[-120, 42], [-114.04, 42], [-114.04, 36.2], [-114.6, 35], [-120, 39]],
  '유타': [[-114.05, 42], [-111.05, 42], [-111.05, 41], [-109.05, 41], [-109.05, 37], [-114.05, 37]],
};
const LABELPOS = { '오리건': [-120.5, 44], '아이다호': [-114.9, 45.2], '몬태나': [-109.5, 47], '와이오밍': [-107.5, 43], '네바다': [-117, 39.5], '유타': [-111.7, 39.3] };
const TRACK = [[-117.8, 42.0, 16.5], [-116.4, 42.3, 14], [-115.4, 42.5, 12], [-114.4, 42.7, 10], [-112.3, 43.6, 6.5], [-110.6, 44.5, 2.1]];
function polyPath(pts, P) { ctx.beginPath(); pts.forEach((p, i) => { const [x, y] = P(p[0], p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); }

/* ---------- shots ---------- */
// 1. aerial Grand Prismatic + title
function sh1(t) {
  fillRect('#5a3a22');
  ctx.save(); cam(540, 1000, 1.05 + t * .16, t * .05);
  for (let i = 0; i < 220; i++) { ctx.fillStyle = `rgba(${120 + R(i) * 60 | 0},${80 + R(i + 1) * 40 | 0},50,.35)`; ctx.beginPath(); ctx.arc(R(i + 2) * 1600 - 260, R(i + 3) * 2600 - 340, 14 + R(i + 4) * 70, 0, TAU); ctx.fill(); }
  for (let i = 0; i < 180; i++) { const top = i % 2; ctx.fillStyle = '#1f3020'; ctx.beginPath(); ctx.arc(R(i + 900) * 1500 - 200, top ? 160 + R(i + 901) * 220 : 1660 + R(i + 901) * 260, 22 + R(i) * 28, 0, TAU); ctx.fill(); }
  prismatic(540, 1000, 430, t);
  ctx.restore();
  steamField(560, 960, 640, t + 4, 34, 1.1, .3);
  const p = easeOut(prog(t, .1, .45));
  txt('옐로스톤', 540, 330, { size: 170, alpha: p, scale: lerp(1.4, 1, p), stroke: 0 });
  txt('발밑에 잠든 거대한 불', 540, 470, { size: 50, weight: 700, color: '#ffd08a', alpha: prog(t, .35, .6) });
}
// 2. Old Faithful erupts, camera tilts up
function sh2(t) {
  fillRect(vgrad(0, H, [[0, '#5d97c8'], [.6, '#cfe2ee'], [1, '#e9e2d0']]));
  ctx.save(); ctx.translate(0, easeOut(prog(t, 0, 1.6)) * 260); cam(540, 1300, 1.12 - t * .05);
  ridge(1180, 120, 1, '#7b8fa0'); ridge(1280, 90, 3, '#4f6a55');
  for (let i = 0; i < 40; i++) pine(R(i + 50) * 1300 - 110, 1300 + R(i + 51) * 40, 70 + R(i + 52) * 70, '#2c4632');
  fillRect(vgrad(1320, 2400, [[0, '#cbbfa4'], [1, '#a59a7f']]), -200, 1320, W + 400, 1200);
  ctx.fillStyle = '#e4dcc7'; ctx.beginPath(); ctx.ellipse(540, 1420, 380, 70, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#d9cfb6'; ctx.beginPath(); ctx.ellipse(540, 1410, 170, 30, 0, 0, TAU); ctx.fill();
  geyser(540, 1410, t + 2, easeOut(prog(t, 0, .45)) * (1 + .06 * Math.sin(t * 7)), 1.9, 420);
  ctx.restore();
}
// 3. dive below the ground
function sh3(t) {
  const off = easeIn(prog(t, 0, 1.5)) * 1500 + t * 120;
  ctx.save(); ctx.translate(0, -off);
  fillRect(vgrad(-400, 700, [[0, '#7fb2d9'], [1, '#e0d6bf']]), 0, -400, W, 1100);
  ridge(680, 70, 2, '#4f6a55');
  for (let i = 0; i < 26; i++) pine(R(i + 7) * W, 700, 80 + R(i + 8) * 60, '#2c4632');
  const bands = ['#8a6a48', '#7a5a3e', '#6a4a34', '#5a3a2a', '#4a2c22', '#3a1e18', '#2e1410'];
  bands.forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, 700 + i * 330); for (let x = 0; x <= W; x += 30) ctx.lineTo(x, 700 + i * 330 + Math.sin(x * .006 + i) * 30); ctx.lineTo(W, 4000); ctx.lineTo(0, 4000); ctx.fill(); });
  for (let i = 0; i < 140; i++) { ctx.fillStyle = `rgba(${40 + R(i) * 60 | 0},${30 + R(i) * 30 | 0},20,.5)`; ctx.beginPath(); ctx.ellipse(R(i + 1) * W, 760 + R(i + 2) * 2400, 10 + R(i + 3) * 40, 6 + R(i + 4) * 22, R(i) * 3, 0, TAU); ctx.fill(); }
  ctx.strokeStyle = 'rgba(255,190,120,.5)'; ctx.lineWidth = 8; ctx.setLineDash([30, 22]); ctx.lineDashOffset = t * 200;
  ctx.beginPath(); ctx.moveTo(540, 700); ctx.bezierCurveTo(500, 1200, 600, 1800, 540, 2900); ctx.stroke(); ctx.setLineDash([]);
  glow(540, 3200, 900, 'rgba(255,110,30,.8)');
  ctx.restore();
}
// 4. magma chamber
function sh4(t) {
  fillRect(vgrad(0, H, [[0, '#1c0c08'], [.5, '#3a1208'], [1, '#160805']]));
  ctx.save(); cam(540, 1000, 1 + t * .14, 0, 0, 0); shake(t, 6, 4);
  for (let i = 0; i < 90; i++) { ctx.fillStyle = `rgba(${30 + R(i) * 30 | 0},${18 + R(i) * 12 | 0},14,1)`; ctx.beginPath(); ctx.arc(R(i + 1) * W, R(i + 2) * H, 30 + R(i + 3) * 90, 0, TAU); ctx.fill(); }
  magmaBlob(540, 1000, 430, t, .62);
  embers(540, 900, 900, t, 60);
  ctx.restore();
  pill('마그마 저장소 · 지하 약 5~17 km', 540, 560, { size: 40, alpha: prog(t, .2, .45), bg: 'rgba(60,10,0,.75)', border: '#ffb36b', scale: lerp(1.2, 1, easeOut(prog(t, .2, .45))) });
}
// earth helper
function earth(t, plumeG) {
  const cx = 540, cy = 1150, RR = 460;
  fillRect('#04050a'); stars(260, 7);
  glow(cx, cy, RR + 140, 'rgba(90,160,255,.4)');
  ctx.beginPath(); ctx.arc(cx, cy, RR, 0, TAU); ctx.fillStyle = '#6b4a2f'; ctx.fill();
  const mg = ctx.createRadialGradient(cx, cy, 250, cx, cy, RR - 14); mg.addColorStop(0, '#f39a2c'); mg.addColorStop(.5, '#d2521c'); mg.addColorStop(1, '#7a2410');
  ctx.beginPath(); ctx.arc(cx, cy, RR - 14, 0, TAU); ctx.fillStyle = mg; ctx.fill();
  const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 250); cg.addColorStop(0, '#fffbe0'); cg.addColorStop(.4, '#ffe07a'); cg.addColorStop(1, '#f2a531');
  ctx.beginPath(); ctx.arc(cx, cy, 250, 0, TAU); ctx.fillStyle = cg; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, 95, 0, TAU); ctx.fillStyle = '#fffcef'; ctx.fill();
  if (plumeG > 0) {
    const y0 = cy - 250, headY = lerp(y0, cy - RR + 40, plumeG);

  [14.0, 15.4, '그리고 초거대 분화.'], [15.4, 17.2, '그것도 세 번이나.'], [17.2, 19.5, '화산재가 대륙을 뒤덮고'], [19.5, 21.5, '땅이 푹 꺼졌어요.'],
  [21.5, 23.0, '이게 옐로스톤 칼데라.'], [23.0, 25.0, '지금도 마그마의 열로'], [25.0, 27.0, '땅이 숨 쉬고 있죠.'], [27.0, 29.6, '옐로스톤은 살아 있는 화산입니다.'],
];
const TR = .3;
function drawShot(i, T, buf) {
  const sh = SHOTS[i]; ctx = buf.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.save(); sh.f(Math.max(0, T - sh.s)); ctx.restore();
  ctx = octx;
}
function blit(buf, x = 0, y = 0, s = 1, a = 1) {
  octx.save(); octx.globalAlpha = a; octx.translate(W / 2 + x, H / 2 + y); octx.scale(s, s); octx.drawImage(buf, -W / 2, -H / 2); octx.restore();
}
function caption(T) {
  const c = CAPS.find(c => T >= c[0] && T < c[1]); if (!c) return;
  const lt = T - c[0], p = easeOut(prog(lt, 0, .14)), a = prog(lt, 0, .06) * prog(c[1] - T, 0, .05);
  ctx = octx; ctx.save(); ctx.font = `900 78px ${FONT}`;
  const words = c[2].split(' '), lines = []; let cur = '';
  words.forEach(w => { const s = cur ? cur + ' ' + w : w; if (ctx.measureText(s).width > 900 && cur) { lines.push(cur); cur = w; } else cur = s; }); lines.push(cur);
  ctx.restore();
  lines.forEach((l, i) => txt(l, 540, 1240 + (i - (lines.length - 1) / 2) * 100, { size: 78, stroke: 14, alpha: a, scale: lerp(1.18, 1, p), shadow: true }));
}
function finish() {
  ctx = octx;
  const g = octx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)');
  octx.fillStyle = g; octx.fillRect(0, 0, W, H);
}
function renderFrame(T) {
  T = clamp(T, 0, TOTAL - .001);
  const i = SHOTS.findIndex(s => T >= s.s && T < s.e), sh = SHOTS[i], lt = T - sh.s;
  octx.setTransform(1, 0, 0, 1, 0, 0); octx.globalAlpha = 1; octx.fillStyle = '#000'; octx.fillRect(0, 0, W, H);
  drawShot(i, T, bufB);
  if (i > 0 && lt < TR && sh.tr !== 'cut') {
    const p = lt / TR, e = ease(p);
    drawShot(i - 1, T, bufA);
    if (sh.tr === 'zoom') { blit(bufB, 0, 0, lerp(.75, 1, easeOut(p)), 1); blit(bufA, 0, 0, lerp(1, 2.2, easeIn(p)), 1 - e); }
    else if (sh.tr === 'whip' || sh.tr === 'whipUp') {
      const v = sh.tr === 'whipUp', o = e * (v ? H : W);
      for (let k = 0; k < 4; k++) { const g = k * 30 * Math.sin(p * Math.PI), a = k ? .25 : 1;
        blit(bufA, v ? 0 : -o - g, v ? -o - g : 0, 1, a); blit(bufB, v ? 0 : W - o - g, v ? H - o - g : 0, 1, a); }
    } else if (sh.tr === 'flash') {
      blit(p < .5 ? bufA : bufB, 0, 0, p < .5 ? 1 + p * .2 : 1.1 - (p - .5) * .2);
      octx.save(); octx.globalAlpha = 1 - Math.abs(p - .5) * 2; octx.fillStyle = '#fff'; octx.fillRect(0, 0, W, H); octx.restore();
    }
  } else blit(bufB);
  finish();
  caption(T);
  if (T > TOTAL - .4) { octx.save(); octx.globalAlpha = prog(T, TOTAL - .4, TOTAL); octx.fillStyle = '#000'; octx.fillRect(0, 0, W, H); octx.restore(); }
  return i;
}
window.renderFrame = renderFrame; window.TOTAL = TOTAL; window.VW = W; window.VH = H;

/* ---------- player ---------- */
const isRender = new URLSearchParams(location.search).has('render');
if (isRender) document.body.classList.add('render');
let playing = false, T = 0, last = 0;
const $ = id => document.getElementById(id);
function setPlaying(p) { playing = p; $('play').textContent = p ? '❚❚' : '▶'; $('bigplay').hidden = p; }
function tick(now) {
  if (playing) { T += (now - last) / 1000; if (T >= TOTAL) T = 0; }
  last = now; renderFrame(T); $('seek').value = T; requestAnimationFrame(tick);
}
if (!isRender) {
  $('play').onclick = $('bigplay').onclick = () => setPlaying(!playing);
  $('seek').oninput = e => { T = +e.target.value; };
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(t => { last = t; tick(t); }));
}
</script>
