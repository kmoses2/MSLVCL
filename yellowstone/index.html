<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>옐로스톤 모션그래픽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0b0d; --panel:#16161a; --fg:#f2efe9; --muted:#9a968e; --accent:#ff8a2a; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font-family:"Noto Sans KR",system-ui,sans-serif; }
  main { max-width:1280px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; font-weight:700; margin:4px 0 12px; }
  h1 small { color:var(--muted); font-weight:400; font-size:14px; margin-left:8px; }
  .stage { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  .bigplay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.35); border:0; color:#fff; font-size:64px; cursor:pointer; }
  .bigplay[hidden] { display:none; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:10px; }
  .controls button { background:var(--panel); color:var(--fg); border:1px solid #2a2a30; border-radius:8px; padding:8px 12px; font:inherit; font-size:14px; cursor:pointer; }
  .controls button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  .controls input[type=range] { flex:1 1 240px; accent-color:var(--accent); }
  .time { font-variant-numeric:tabular-nums; font-size:14px; color:var(--muted); min-width:96px; }
  .chapters { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .chapters button { background:transparent; color:var(--muted); border:1px solid #2a2a30; border-radius:999px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; }
  .chapters button.on { color:#111; background:var(--accent); border-color:var(--accent); }
  body.render main { padding:0; max-width:none; }
  body.render h1, body.render .controls, body.render .chapters, body.render .bigplay { display:none; }
  body.render .stage { width:1920px; height:1080px; border-radius:0; }
</style>
</head>
<body>
<main>
  <h1>🌋 옐로스톤은 어떻게 만들어졌을까? <small>발밑에 잠든 거대한 불의 이야기 · 7분 20초</small></h1>
  <div class="stage">
    <canvas id="c" width="1920" height="1080"></canvas>
    <button class="bigplay" id="bigplay" aria-label="재생">▶</button>
  </div>
  <div class="controls">
    <button id="play">▶ 재생</button>
    <span class="time" id="time">0:00 / 7:20</span>
    <input type="range" id="seek" min="0" max="440" step="0.1" value="0" aria-label="재생 위치">
    <button id="cc" aria-pressed="true">자막</button>
    <button id="tts" aria-pressed="false">음성 읽기</button>
    <button id="fs">전체화면</button>
  </div>
  <div class="chapters" id="chapters"></div>
</main>
<script>
"use strict";
const W = 1920, H = 1080, TOTAL = 440;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const win = (t, a, b, f = 1) => clamp((t - a) / f) * clamp((b - t) / f);
const R = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const TAU = Math.PI * 2;

function text(str, x, y, o = {}) {
  const { size = 40, weight = 700, color = '#fff', align = 'center', alpha = 1, base = 'middle', shadow = true } = o;
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = base;
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,.65)'; ctx.shadowBlur = size * .35; ctx.shadowOffsetY = 2; }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}
function pill(str, x, y, o = {}) {
  const { size = 30, alpha = 1, bg = 'rgba(0,0,0,.55)', color = '#fff', border = null, align = 'center' } = o;
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `700 ${size}px ${FONT}`;
  const w = ctx.measureText(str).width + size * 1.2, h = size * 1.7;
  const x0 = align === 'left' ? x : align === 'right' ? x - w : x - w / 2;
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(x0, y - h / 2, w, h, h / 2); ctx.fill();
  if (border) { ctx.strokeStyle = border; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(str, x0 + w / 2, y + 1);
  ctx.restore();
}
function glow(x, y, r, color, alpha = 1) {
  if (alpha <= 0 || r <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.restore();
}
function puff(x, y, r, a, c = '255,255,255') {
  if (a <= 0 || r <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(1, `rgba(${c},0)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function arrow(x1, y1, x2, y2, color = '#fff', w = 4, head = 18) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * head * .6, y2 - Math.sin(a) * head * .6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - Math.cos(a - .45) * head, y2 - Math.sin(a - .45) * head);
  ctx.lineTo(x2 - Math.cos(a + .45) * head, y2 - Math.sin(a + .45) * head);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function vgrad(y0, y1, stops) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  return g;
}
function fillRect(c, x = 0, y = 0, w = W, h = H) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function stars(n, seed, alpha = 1, ymax = H) {
  ctx.save(); ctx.fillStyle = '#fff';
  for (let i = 0; i < n; i++) {
    ctx.globalAlpha = alpha * (.25 + .75 * R(seed + i * 3.1));
    ctx.fillRect(R(seed + i) * W, R(seed + i * 1.7) * ymax, 1.6, 1.6);
  }
  ctx.restore();
}
function ridge(y0, amp, seed, color, freq = 1) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) {
    const y = y0 - amp * (.5 * Math.sin(x * .004 * freq + seed) + .3 * Math.sin(x * .011 * freq + seed * 2.3) + .2 * Math.sin(x * .023 * freq + seed * 5.1));
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}
function blobPath(cx, cy, r, seed, wob = .07, sy = 1) {
  ctx.beginPath();
  for (let k = 0; k <= 96; k++) {
    const th = k / 96 * TAU;
    const rr = r * (1 + wob * Math.sin(3 * th + seed) + wob * .6 * Math.sin(7 * th + seed * 2) + wob * .3 * Math.sin(13 * th + seed * 3));
    const x = cx + Math.cos(th) * rr, y = cy + Math.sin(th) * rr * sy;
    k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/* ---------- reusable visuals ---------- */
const PRISM = [[1.0, '#6e3412'], [.9, '#a9481a'], [.8, '#d26a1f'], [.7, '#e69a33'], [.61, '#e9c64e'], [.53, '#bcc96c'], [.46, '#5fb0a0'], [.39, '#2b93c2'], [.28, '#176fb0'], [.16, '#0c4f8f']];
function prismatic(cx, cy, R0, t, sy = 1) {
  // runoff channels
  ctx.save();
  for (let i = 0; i < 26; i++) {
    const a = R(i + 40) * TAU, len = R0 * (.4 + R(i + 41) * .7);
    ctx.strokeStyle = `rgba(${200 + R(i) * 40 | 0},${90 + R(i + 1) * 50 | 0},30,.55)`;
    ctx.lineWidth = 6 + R(i + 2) * 14;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * R0 * .9, cy + Math.sin(a) * R0 * .9 * sy);
    ctx.quadraticCurveTo(cx + Math.cos(a + .15) * (R0 + len * .5), cy + Math.sin(a + .15) * (R0 + len * .5) * sy,
      cx + Math.cos(a + .05) * (R0 + len), cy + Math.sin(a + .05) * (R0 + len) * sy);
    ctx.stroke();
  }
  PRISM.forEach(([k, c], i) => {
    blobPath(cx, cy, R0 * k, 1.3 + i * .2, .05 - i * .003, sy);
    ctx.fillStyle = c; ctx.fill();
  });
  // shimmer
  ctx.globalAlpha = .18;
  blobPath(cx, cy, R0 * .38, 4, .04, sy);
  const g = ctx.createRadialGradient(cx - R0 * .1, cy - R0 * .1 * sy, 0, cx, cy, R0 * .4);
  g.addColorStop(0, '#bfe9ff'); g.addColorStop(1, 'rgba(0,80,160,0)');
  ctx.fillStyle = g; ctx.fill();
  ctx.restore();
}
function steamField(cx, cy, spread, t, n = 50, scale = 1, alpha = .35) {
  for (let i = 0; i < n; i++) {
    const life = 7 + R(i) * 4;
    const age = (t + R(i + 9) * life) % life, f = age / life;
    const x = cx + (R(i + 3) - .5) * spread + age * (40 + R(i + 5) * 30) * scale;
    const y = cy + (R(i + 4) - .5) * spread * .4 - age * (60 + R(i + 6) * 50) * scale;
    puff(x, y, (60 + f * 200) * scale, alpha * Math.sin(f * Math.PI));
  }
}
function geyser(x, base, t, strength, scale = 1, n = 260) {
  if (strength <= 0) return;
  ctx.save();
  const ch = 560 * strength * scale;
  const cg = ctx.createLinearGradient(0, base, 0, base - ch);
  cg.addColorStop(0, 'rgba(240,248,255,.85)'); cg.addColorStop(.7, 'rgba(230,242,252,.5)'); cg.addColorStop(1, 'rgba(230,242,252,0)');
  ctx.fillStyle = cg; ctx.beginPath();
  ctx.moveTo(x - 16 * scale, base);
  for (let k = 0; k <= 10; k++) { const yy = base - ch * k / 10; ctx.lineTo(x - (16 + k * 9) * scale + Math.sin(t * 9 + k) * 4 * scale, yy); }
  for (let k = 10; k >= 0; k--) { const yy = base - ch * k / 10; ctx.lineTo(x + (16 + k * 9) * scale + Math.sin(t * 8 + k * 1.3) * 4 * scale, yy); }
  ctx.closePath(); ctx.fill();
  for (let i = 0; i < n; i++) {
    const life = 1.6 + R(i) * 1.4;
    const age = (t + R(i + 1) * life) % life;
    const v = (700 + R(i + 2) * 600) * strength * scale, g = 520 * scale;
    const y = base - (v * age - .5 * g * age * age);
    if (y > base) continue;
    const xx = x + (R(i + 3) - .5) * 30 * scale + (R(i + 4) - .5) * 160 * age * scale + age * age * 30 * scale;
    ctx.globalAlpha = .55 * (1 - age / life);
    ctx.fillStyle = R(i + 5) > .3 ? '#eef7ff' : '#bcdcf0';
    const s = (3 + R(i + 6) * 6) * scale * (1 + age);
    ctx.fillRect(xx - s / 2, y - s / 2, s, s);
  }
  ctx.restore();
  for (let i = 0; i < 26; i++) {
    const life = 5, age = (t + R(i + 70) * life) % life, f = age / life;
    const top = base - 520 * strength * scale;
    puff(x + (R(i + 71) - .3) * 120 * scale + age * 60 * scale, top + 120 * scale - age * 70 * scale + R(i) * 200 * scale,
      (50 + f * 150) * scale, .4 * strength * Math.sin(f * Math.PI));
  }
}
function bison(x, y, s, ph, color = '#14100c') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = color;
  for (let k = 0; k < 4; k++) {
    const lx = [-45, -30, 38, 52][k], a = Math.sin(ph + (k % 2 ? Math.PI : 0) + (k > 1 ? .8 : 0)) * .32;
    ctx.save(); ctx.translate(lx, -2); ctx.rotate(a); ctx.fillRect(-5, 0, 10, 32); ctx.restore();
  }
  ctx.beginPath();
  ctx.moveTo(-62, -18);
  ctx.bezierCurveTo(-64, -44, -30, -50, 0, -48);
  ctx.bezierCurveTo(22, -74, 48, -74, 58, -52);
  ctx.bezierCurveTo(70, -46, 80, -30, 84, -10);
  ctx.lineTo(86, 2); ctx.lineTo(72, 8);
  ctx.bezierCurveTo(64, 14, 54, 10, 48, 4);
  ctx.lineTo(-56, 4);
  ctx.bezierCurveTo(-66, 0, -66, -10, -62, -18);
  ctx.fill();
  ctx.beginPath(); ctx.moveTo(-62, -30); ctx.quadraticCurveTo(-74, -16, -70, 2); ctx.lineWidth = 3; ctx.strokeStyle = color; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(72, -36); ctx.quadraticCurveTo(80, -46, 76, -52); ctx.lineWidth = 4; ctx.stroke();
  ctx.restore();
}
function pine(x, y, h, c) {
  ctx.fillStyle = c; ctx.beginPath();
  ctx.moveTo(x, y - h); ctx.lineTo(x + h * .22, y); ctx.lineTo(x - h * .22, y); ctx.closePath(); ctx.fill();
}

/* ---------- map projection (scene 3, 4) ---------- */
const STATES = {
  '오리건': [[-124.5, 42], [-117.03, 42], [-117.03, 43.8], [-116.9, 44.2], [-117.2, 44.3], [-116.5, 45.6], [-116.9, 46], [-119, 46], [-121, 45.6], [-124, 46.2]],
  '아이다호': [[-117.03, 49], [-116.05, 49], [-116.05, 47.98], [-115.72, 47.42], [-114.33, 46.66], [-114.5, 45.56], [-113.45, 44.86], [-112.84, 44.36], [-111.05, 44.48], [-111.05, 42], [-117.03, 42], [-117.03, 43.8], [-116.9, 44.2], [-117.2, 44.3], [-116.5, 45.6], [-116.9, 46], [-117.03, 46.4]],
  '몬태나': [[-116.05, 49], [-104.05, 49], [-104.05, 45], [-111.05, 45], [-111.05, 44.48], [-112.84, 44.36], [-113.45, 44.86], [-114.5, 45.56], [-114.33, 46.66], [-115.72, 47.42], [-116.05, 47.98]],
  '와이오밍': [[-111.05, 45], [-104.05, 45], [-104.05, 41], [-111.05, 41]],
  '네바다': [[-120, 42], [-114.04, 42], [-114.04, 36.2], [-114.6, 35], [-120, 39]],
  '유타': [[-114.05, 42], [-111.05, 42], [-111.05, 41], [-109.05, 41], [-109.05, 37], [-114.05, 37]],
  '워싱턴': [[-124.7, 48.4], [-123, 48.9], [-117.03, 49], [-117.03, 46.4], [-116.9, 46], [-119, 46], [-121, 45.6], [-124, 46.2]],
  '캘리포니아': [[-124.4, 42], [-120, 42], [-120, 39], [-114.6, 35], [-114.7, 32.7], [-117.1, 32.5], [-118.5, 34], [-120.6, 34.6], [-122.4, 37.2], [-123.7, 38.9], [-124.2, 40.4]],
  '콜로라도': [[-109.05, 41], [-102.05, 41], [-102.05, 37], [-109.05, 37]],
};
const LABELPOS = { '오리건': [-120.5, 44], '아이다호': [-115, 44.6], '몬태나': [-109.5, 47], '와이오밍': [-107.5, 43], '네바다': [-117, 39.5], '유타': [-111.7, 39.3], '워싱턴': [-120.5, 47.4], '캘리포니아': [-121.5, 38.5], '콜로라도': [-105.5, 39] };
const TRACK = [ // lon, lat, age (Ma), name
  [-117.8, 42.0, 16.5, '맥더밋'], [-116.4, 42.3, 14, '오와이히'], [-115.4, 42.5, 12, '브루노-자비지'],
  [-114.4, 42.7, 10, '트윈폴스'], [-112.3, 43.6, 6.5, '헤이스'], [-110.6, 44.5, 2.1, '옐로스톤'],
];
const US = [[-124.7, 48.4], [-123, 48.9], [-95.2, 49], [-94.8, 49.4], [-89.6, 48], [-84.8, 46.5], [-83.5, 46.1], [-82.4, 43], [-79, 43.3], [-76, 44.2], [-74.9, 45], [-71.5, 45], [-69.2, 47.4], [-67.8, 47.1], [-67, 44.8], [-70, 43.7], [-70.6, 42], [-70, 41.6], [-73.9, 40.6], [-74, 39.5], [-75.5, 38.6], [-76, 37], [-75.5, 35.3], [-77.9, 33.9], [-79.2, 33.2], [-81, 31.9], [-81.4, 30.4], [-80, 26.7], [-80.4, 25.2], [-81.7, 25.9], [-82.8, 27.9], [-84, 30], [-85.4, 29.7], [-88, 30.7], [-89.6, 30.2], [-89.4, 29], [-91, 29.2], [-94, 29.6], [-97.2, 27.6], [-97.4, 25.9], [-99.1, 26.4], [-101.4, 29.8], [-103, 29], [-104.5, 29.6], [-106.5, 31.8], [-108.2, 31.3], [-111, 31.3], [-114.8, 32.5], [-117.1, 32.5], [-118.5, 34], [-120.6, 34.6], [-122.4, 37.2], [-123.7, 38.9], [-124.2, 40.4], [-124.4, 42.8], [-124, 46.2]];
function polyPath(pts, P) { ctx.beginPath(); pts.forEach((p, i) => { const [x, y] = P(p[0], p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); }

/* ---------- SCENES ---------- */

// 1. Opening
function s1(t) {
  // A: aerial Grand Prismatic (0-17)
  if (t < 18) {
    fillRect('#5a3a22');
    const z = 1 + t * .012;
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.rotate(t * .004); ctx.translate(-W / 2, -H / 2);
    for (let i = 0; i < 260; i++) { ctx.fillStyle = `rgba(${120 + R(i) * 60 | 0},${80 + R(i + 1) * 40 | 0},50,.35)`; ctx.beginPath(); ctx.arc(R(i + 2) * W * 1.2 - 100, R(i + 3) * H * 1.2 - 100, 10 + R(i + 4) * 60, 0, TAU); ctx.fill(); }
    // forest edges
    for (let i = 0; i < 160; i++) { const x = R(i + 900) * W, y = R(i + 901) * 200 + (i % 2 ? -40 : H - 140); ctx.fillStyle = '#1f3020'; ctx.beginPath(); ctx.arc(x, y, 18 + R(i) * 22, 0, TAU); ctx.fill(); }
    prismatic(W * .5, H * .52, 360, t);
    ctx.restore();
    steamField(W * .5, H * .5, 700, t, 60, 1.1, .32);
    const a = win(t, 2.5, 15, 1.2);
    ctx.save(); ctx.globalAlpha = a * .55; fillRect(vgrad(0, H, [[0, 'rgba(0,0,0,.0)'], [.5, 'rgba(0,0,0,.55)'], [1, 'rgba(0,0,0,0)']])); ctx.restore();
    text('🌋', W / 2, 330, { size: 84, alpha: a, shadow: false });
    text('옐로스톤은 어떻게 만들어졌을까?', W / 2, 460, { size: 92, weight: 900, alpha: a });
    text('발밑에 잠든 거대한 불의 이야기', W / 2, 570, { size: 46, weight: 500, color: '#ffcf8a', alpha: a * prog(t, 4, 5.5) });
    pill('그랜드 프리즈매틱 스프링', 1620, 900, { size: 28, alpha: win(t, 9, 17) });
  }
  // B: Old Faithful (16-29)
  if (t > 16 && t < 30) {
    ctx.save(); ctx.globalAlpha = win(t, 16, 30, 1.2);
    fillRect(vgrad(0, H, [[0, '#7fb2d9'], [.55, '#cfe2ee'], [1, '#e9e2d0']]));
    ridge(560, 90, 1, '#7b8fa0'); ridge(640, 70, 3, '#4f6a55');
    for (let i = 0; i < 70; i++) pine(R(i + 50) * W, 660 + R(i + 51) * 30, 50 + R(i + 52) * 50, '#2c4632');
    fillRect(vgrad(680, H, [[0, '#cbbfa4'], [1, '#a59a7f']]), 0, 680, W, H - 680);
    ctx.fillStyle = '#e4dcc7'; ctx.beginPath(); ctx.ellipse(960, 760, 360, 60, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#d9cfb6'; ctx.beginPath(); ctx.ellipse(960, 752, 160, 26, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#6b5236'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, 900); ctx.quadraticCurveTo(960, 840, W, 910); ctx.stroke();

  if (t < 15) { ctx.save(); ctx.globalAlpha = clamp((15 - t) / 1.2); eruptionScene(t); text('초거대 분화', 960, 140, { size: 72, weight: 900, alpha: win(t, 2, 13) }); text('Supereruption', 960, 215, { size: 32, weight: 500, color: '#ffb36b', alpha: win(t, 2.5, 13) }); ctx.restore(); }
  // B: ash map (13-44)
  if (t > 13 && t < 45) {
    ctx.save(); ctx.globalAlpha = win(t, 13, 45, 1.2);
    fillRect('#0c1520');
    const P = (lon, lat) => [960 + (lon + 97) * 25, 470 - (lat - 38) * 33];
    ctx.save(); ctx.fillStyle = '#1b2733'; ctx.fillRect(0, 0, W, P(0, 49)[1]); ctx.restore();
    polyPath(US, P); ctx.fillStyle = '#2f3e33'; ctx.fill(); ctx.strokeStyle = 'rgba(230,230,210,.4)'; ctx.lineWidth = 2; ctx.stroke();
    text('캐나다', ...P(-100, 52), { size: 26, weight: 500, color: 'rgba(230,230,210,.5)', shadow: false });
    text('멕시코', ...P(-104, 27.2), { size: 26, weight: 500, color: 'rgba(230,230,210,.5)', shadow: false });
    ctx.save(); polyPath(US, P); ctx.clip();
    ASH.forEach((a, k) => {
      const t0 = 16 + k * 8.5, g = easeOut(prog(t, t0, t0 + 5));
      a.blobs.forEach(([lon, lat, r, sd]) => {
        const [x, y] = P(lerp(-110.6, lon, g), lerp(44.5, lat, g));
        blobPath(x, y, r * 33 * g, sd, .12, .85);
        ctx.fillStyle = `rgba(${[205, 180, 230][k]},${[200, 175, 215][k]},${[190, 165, 190][k]},${.22 + (k === Math.floor(prog(t, 16, 41.5) * 3) ? .15 : 0)})`; ctx.fill();
      });
    });
    ctx.restore();
    const [yx, yy] = P(-110.6, 44.5);
    glow(yx, yy, 70, 'rgba(255,90,20,.95)', .8 + .2 * Math.sin(t * 5));
    pill('옐로스톤', yx, yy - 60, { size: 26, bg: 'rgba(120,30,0,.8)' });
    // timeline
    const ty = 860;
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(260, ty); ctx.lineTo(1660, ty); ctx.stroke();
    text('200만 년 전', 260, ty + 40, { size: 22, weight: 500, color: '#aaa' }); text('현재', 1660, ty + 40, { size: 22, weight: 500, color: '#aaa' });
    ASH.forEach((a, k) => {
      const t0 = 16 + k * 8.5, x = 260 + (1 - [2.1, 1.3, .63][k] / 2.2) * 1400 + [-60, 0, 0][k];
      const ap = prog(t, t0, t0 + 1);
      ctx.fillStyle = '#ff7b1c'; ctx.globalAlpha *= 1; ctx.beginPath(); ctx.arc(x, ty, 10 + 6 * ap, 0, TAU); ctx.fill();
      text(a.age, x, ty - 80, { size: 34, weight: 900, color: '#ffcf8a', alpha: ap });
      text(`${a.name} · ${a.vol}`, x, ty - 38, { size: 24, weight: 500, alpha: ap });
    });
    pill('화산재가 북아메리카의 넓은 지역을 뒤덮다', 960, 80, { size: 34, alpha: win(t, 18, 43.5), bg: 'rgba(0,0,0,.6)' });
    ctx.restore();
  }
  // C: volume comparison (43-55)
  if (t > 43 && t < 56) {
    ctx.save(); ctx.globalAlpha = win(t, 43, 56, 1.2);
    fillRect('#121214');
    text('분출된 마그마의 양 비교', 960, 110, { size: 48, weight: 900 });
    const items = [['1980 세인트헬렌스', 1, '#9fd8ff'], ['130만 년 전', 280, '#e9c64e'], ['63만 년 전', 1000, '#ff9a3a'], ['210만 년 전', 2500, '#ff5a2a']];
    let x = 260; const base = 820;
    items.forEach(([nm, v, c], i) => {
      const s = 30 * Math.cbrt(v) * easeOut(prog(t, 44 + i * 1.6, 46 + i * 1.6));
      const d = s * .35;
      ctx.fillStyle = c; ctx.globalAlpha = 1; ctx.fillRect(x, base - s, s, s);
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.moveTo(x, base - s); ctx.lineTo(x + d, base - s - d); ctx.lineTo(x + s + d, base - s - d); ctx.lineTo(x + s, base - s); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.moveTo(x + s, base - s); ctx.lineTo(x + s + d, base - s - d); ctx.lineTo(x + s + d, base - d); ctx.lineTo(x + s, base); ctx.fill();
      const a = prog(t, 45 + i * 1.6, 46.5 + i * 1.6);
      text(nm, x + Math.max(s, 40) / 2, base + 50, { size: 26, weight: 700, alpha: a });
      text(`${v.toLocaleString()} km³`, x + Math.max(s, 40) / 2, base + 90, { size: 24, weight: 500, color: c, alpha: a });
      x += Math.max(s * 1.35, 230) + 60;
    });
    ctx.restore();
  }
  // D: caldera collapse (54-80)
  if (t > 54) {
    ctx.save(); ctx.globalAlpha = win(t, 54, 81, 1.2);
    fillRect(vgrad(0, 420, [[0, '#3b4c63'], [1, '#a9a7a0']]), 0, 0, W, 420);
    const drain = prog(t, 56, 64), drop = ease(prog(t, 61, 68));
    const L = 360, Rr = 1560, top = 420, dd = 170 * drop;
    // magma chamber
    fillRect(vgrad(420, H, [[0, '#6b5644'], [.6, '#4a3124'], [1, '#3a1a10']]), 0, 420, W, H - 420);
    const cy = 790, level = lerp(cy - 150, cy + 150, drain * .85);
    ctx.save(); ctx.beginPath(); ctx.ellipse(960, cy, 560, 160, 0, 0, TAU); ctx.fillStyle = '#2a1510'; ctx.fill(); ctx.clip();
    ctx.fillStyle = vgrad(level, cy + 160, [[0, '#ffcf5a'], [.4, '#ff6a1a'], [1, '#a3200c']]); ctx.fillRect(0, level, W, H);
    ctx.restore();
    // central block (drops)
    ctx.fillStyle = '#7a6550';
    ctx.beginPath(); ctx.moveTo(L, top + dd); ctx.lineTo(Rr, top + dd); ctx.lineTo(Rr - 40, 630 + dd); ctx.lineTo(L + 40, 630 + dd); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(L + 10 * i, top + dd + i * 50); ctx.lineTo(Rr - 10 * i, top + dd + i * 50); ctx.stroke(); }
    // outer ground
    ctx.fillStyle = '#7a6550'; ctx.fillRect(0, top, L, 220); ctx.fillRect(Rr, top, W - Rr, 220);
    ctx.fillStyle = '#4f6a55'; ctx.fillRect(0, top - 14, L, 14); ctx.fillRect(Rr, top - 14, W - Rr, 14); ctx.fillRect(L, top + dd - 14, Rr - L, 14);
    // ring faults
    ctx.strokeStyle = '#1a0e08'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(L, top - 14); ctx.lineTo(L + 40, 650 + dd); ctx.moveTo(Rr, top - 14); ctx.lineTo(Rr - 40, 650 + dd); ctx.stroke();
    // eruption jets from ring faults
    const jet = win(t, 55.5, 64, 1);
    [L, Rr].forEach((x, j) => {
      glow(x, top, 120, 'rgba(255,140,40,.9)', jet);
      for (let i = 0; i < 40; i++) { const f = (t * .4 + R(i + j * 50)) % 1; puff(x + (R(i + 1) - .5) * 120 + (j ? 1 : -1) * f * 60, top - f * 380, 30 + f * 90, .6 * jet * (1 - f), '110,100,95'); }
    });
    pill('① 마그마가 한꺼번에 빠져나가고', 960, 120, { size: 34, alpha: win(t, 55.5, 61.5), bg: 'rgba(0,0,0,.6)' });
    pill('② 위의 땅이 버티지 못하고 푹 꺼진다', 960, 120, { size: 34, alpha: win(t, 62, 68.5), bg: 'rgba(0,0,0,.6)' });
    // dimension
    const da = prog(t, 69, 70.5);
    if (da > 0) {
      ctx.save(); ctx.globalAlpha *= da;
      arrow(960, 300, L + 10, 300, '#ffcf8a', 4, 20); arrow(960, 300, Rr - 10, 300, '#ffcf8a', 4, 20);
      ctx.restore();
      text('약 70~80 km', 960, 260, { size: 48, weight: 900, color: '#ffcf8a', alpha: da });
      pill('칼데라 (Caldera) · 거대한 가마솥 모양 분지', 960, 120, { size: 34, alpha: win(t, 70, 80), bg: 'rgba(80,20,0,.75)', border: '#ffcf8a' });
      text('너무 커서 땅 위에서는 분화구인지조차 알아보기 어렵다', 960, 1000 - 70, { size: 28, weight: 500, color: '#eee', alpha: win(t, 74, 80) * 0 });
    }
    ctx.restore();
  }
}

// 5. Lava & ice
function s5(t) {
  // A: lava fill (0-21)
  if (t < 22) {
    ctx.save(); ctx.globalAlpha = clamp((22 - t) / 1.2);
    fillRect(vgrad(0, 500, [[0, '#2c3b55'], [1, '#9c9a94']]), 0, 0, W, 500);
    fillRect(vgrad(420, H, [[0, '#6b5644'], [1, '#3a1a10']]), 0, 420, W, H - 420);
    ctx.fillStyle = '#4f6a55'; ctx.fillRect(0, 406, 360, 14); ctx.fillRect(1560, 406, 360, 14);
    ctx.fillStyle = vgrad(0, 590, [[0, '#2c3b55'], [1, '#9c9a94']]); ctx.fillRect(360, 400, 1200, 190);
    ctx.fillStyle = '#3a2c22'; ctx.fillRect(360, 590, 1200, 490);
    const n = 6;
    for (let i = 0; i < n; i++) {
      const t0 = 2 + i * 2.6, g = ease(prog(t, t0, t0 + 2.2)), cool = prog(t, t0 + 2, t0 + 6);
      if (g <= 0) continue;
      const yb = 590 - i * 30, yt = yb - 30;
      const reach = g;
      const hot = `rgb(${lerp(255, 90, cool) | 0},${lerp(130, 72, cool) | 0},${lerp(30, 60, cool) | 0})`;
      ctx.fillStyle = hot;
      ctx.beginPath(); ctx.moveTo(960 - 600 * reach, yb); ctx.lineTo(960 + 600 * reach, yb);
      for (let x = 960 + 600 * reach; x >= 960 - 600 * reach; x -= 30) ctx.lineTo(x, yt + Math.sin(x * .02 + i) * 4);
      ctx.closePath(); ctx.fill();
      if (cool < 1) glow(960, yt, 500 * reach, 'rgba(255,120,30,.5)', 1 - cool);
    }
    pill('수십만 년 동안 · 끈적한 용암이 여러 차례', 960, 140, { size: 34, alpha: win(t, 2, 20.5), bg: 'rgba(0,0,0,.6)' });
    pill('→ 오늘날 옐로스톤 고원의 바탕', 960, 230, { size: 30, alpha: win(t, 15, 20.5), bg: 'rgba(80,30,0,.6)', border: '#ffcf8a' });
    ctx.restore();
  }
  // B: ice age (20-41)
  if (t > 20 && t < 42) {
    ctx.save(); ctx.globalAlpha = win(t, 20, 42, 1.2);
    fillRect(vgrad(0, 600, [[0, '#4e6d8c'], [1, '#d6e4ee']]), 0, 0, W, 600);
    const surf = 600, notch = ease(prog(t, 33, 40));
    ctx.fillStyle = '#5b4a3a';
    ctx.beginPath(); ctx.moveTo(0, surf);
    ctx.lineTo(820, surf); ctx.lineTo(960, surf + 220 * notch); ctx.lineTo(1100, surf);
    ctx.lineTo(W, surf); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    ctx.fillStyle = '#4f6a55'; ctx.fillRect(0, surf - 10, 820, 10); ctx.fillRect(1100, surf - 10, W - 1100, 10);
    const grow = ease(prog(t, 21, 27)), melt = ease(prog(t, 30, 37));
    const thick = 300 * grow * (1 - melt);
    if (thick > 1) {
      ctx.fillStyle = vgrad(surf - thick, surf, [[0, '#f4fbff'], [1, '#a9d4ec']]);
      ctx.beginPath(); ctx.moveTo(0, surf);
      for (let x = 0; x <= W; x += 40) ctx.lineTo(x, surf - thick + Math.sin(x * .006) * 18 * grow);
      ctx.lineTo(W, surf); ctx.fill();
      ctx.save(); ctx.globalAlpha *= win(t, 25, 31);
      arrow(1700, surf - 10, 1700, surf - thick + 20, '#123', 4, 18); arrow(1700, surf - thick + 20, 1700, surf - 10, '#123', 4, 18);
      text('약 1 km', 1680, surf - thick / 2, { size: 34, weight: 900, color: '#0d2a40', align: 'right', shadow: false });
      ctx.restore();
    }
    // snow
    for (let i = 0; i < 120; i++) { const f = (t * .15 + R(i)) % 1; ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(R(i + 1) * W + Math.sin(t + i) * 20, f * surf, 3, 3); }
    // meltwater
    if (melt > 0) {
      ctx.save(); ctx.globalAlpha *= melt;
      ctx.strokeStyle = '#5fc4ff'; ctx.lineWidth = 8; ctx.setLineDash([26, 16]); ctx.lineDashOffset = -t * 90;
      ctx.beginPath(); ctx.moveTo(200, surf - 6); ctx.quadraticCurveTo(600, surf - 4, 950, surf + 210 * notch); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(1720, surf - 6); ctx.quadraticCurveTo(1300, surf - 4, 970, surf + 210 * notch); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
    }
    pill('빙하기 · 고원 전체를 덮은 얼음', 960, 120, { size: 34, alpha: win(t, 22, 30), bg: 'rgba(0,30,60,.6)' });
    pill('약 1만 4천 년 전 · 얼음이 녹으며 땅을 깎다', 960, 120, { size: 34, alpha: win(t, 31, 40.5), bg: 'rgba(0,30,60,.6)' });
    text('호수 · 계곡 · 폭포', 960, 950, { size: 40, weight: 900, color: '#bfe6ff', alpha: win(t, 37, 41) });
    ctx.restore();
  }
  // C: Grand Canyon of the Yellowstone (39-60)
  if (t > 39) {
    ctx.save(); ctx.globalAlpha = win(t, 39, 61, 1.2);
    fillRect(vgrad(0, 400, [[0, '#7db3dc'], [1, '#dbe9f1']]), 0, 0, W, 400);
    ridge(330, 50, 4, '#3f5a46');
    // far falls
    const fx = 960, ftop = 360, fbot = 640;
    ctx.fillStyle = '#7e6a52'; ctx.fillRect(820, 330, 280, 330);
    ctx.fillStyle = vgrad(ftop, fbot, [[0, '#e8f6ff'], [1, '#ffffff']]); ctx.fillRect(fx - 34, ftop, 68, fbot - ftop);
    for (let i = 0; i < 80; i++) { const f = (t * .9 + R(i)) % 1; ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(fx - 34 + R(i + 1) * 68, ftop + f * (fbot - ftop), 3, 14); }
    for (let i = 0; i < 16; i++) { const f = (t * .3 + R(i + 30)) % 1; puff(fx + (R(i + 31) - .5) * 200, fbot - f * 120, 50 + f * 80, .45 * (1 - f)); }

    ctx.fillStyle = wallG(0, 900);
    ctx.beginPath(); ctx.moveTo(0, 300); ctx.lineTo(820, 340); ctx.lineTo(900, 660); ctx.lineTo(760, H); ctx.lineTo(0, H); ctx.fill();
    ctx.fillStyle = wallG(1920, 1020);
    ctx.beginPath(); ctx.moveTo(W, 290); ctx.lineTo(1100, 340); ctx.lineTo(1020, 660); ctx.lineTo(1160, H); ctx.lineTo(W, H); ctx.fill();

    for (let i = 0; i < 40; i++) { const left = i % 2 === 0; const x = left ? R(i) * 780 : 1140 + R(i) * 780; ctx.strokeStyle = R(i + 1) > .5 ? '#fff4d8' : '#8a3a1a'; ctx.lineWidth = 3 + R(i + 2) * 8; ctx.beginPath(); ctx.moveTo(x, 330 + R(i + 3) * 60); ctx.lineTo(x + (left ? 40 : -40), H); ctx.stroke(); }
    ctx.restore();
    // river
    ctx.fillStyle = '#3c9a8a'; ctx.beginPath(); ctx.moveTo(900, 660); ctx.lineTo(1020, 660); ctx.lineTo(1160, H); ctx.lineTo(760, H); ctx.fill();
    for (let i = 0; i < 30; i++) { const f = (t * .25 + R(i + 60)) % 1; ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(lerp(930, 820, f) + R(i) * lerp(60, 300, f), lerp(660, H, f), 14 + f * 30, 3); }
    for (let i = 0; i < 40; i++) { const left = i < 20; pine(left ? R(i) * 820 : 1100 + R(i) * 820, 310 + R(i + 1) * 30, 40 + R(i + 2) * 40, '#23402c'); }
    pill('옐로스톤 그랜드캐니언', 960, 110, { size: 38, alpha: win(t, 41, 59.5), bg: 'rgba(0,0,0,.55)' });
    pill('뜨거운 지하수가 화산암을 변질시켜 생긴 노랑·붉은빛', 960, 860, { size: 30, alpha: win(t, 47, 59.5), bg: 'rgba(60,20,0,.7)', border: '#ffcf8a' });
    pill('로어 폭포', 1150, 470, { size: 24, alpha: win(t, 43, 59) });
    ctx.restore();
  }

// 6. Hydrothermal
function s6(t) {
  // A: plumbing cross-section (0-36)
  if (t < 37) {
    ctx.save(); ctx.globalAlpha = clamp((37 - t) / 1.2);
    const S = 420;
    fillRect(vgrad(0, S, [[0, '#5d7f9d'], [1, '#c9d8e2']]), 0, 0, W, S);
    ridge(S - 30, 30, 6, '#4f6a55');
    // clouds & rain
    const rain = win(t, 1, 14, 1.5);
    for (let i = 0; i < 6; i++) puff(200 + i * 300 + Math.sin(t * .2 + i) * 30, 90 + R(i) * 40, 170, .7 * rain, '230,235,240');
    ctx.save(); ctx.strokeStyle = `rgba(160,200,240,${.7 * rain})`; ctx.lineWidth = 2;
    for (let i = 0; i < 140; i++) { const f = (t * 1.4 + R(i)) % 1, x = R(i + 1) * W, y = 140 + f * (S - 140); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 6, y + 22); ctx.stroke(); }
    ctx.restore();
    // ground
    fillRect(vgrad(S, H, [[0, '#7a6550'], [.55, '#4a3124'], [.82, '#6a2412'], [1, '#e2541a']]), 0, S, W, H - S);
    for (let i = 0; i < 5; i++) { ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 2; ctx.beginPath(); for (let x = 0; x <= W; x += 30) { const y = S + 70 + i * 110 + Math.sin(x * .005 + i * 1.7) * 14; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); }
    glow(960, H + 120, 760, 'rgba(255,170,60,.75)', .8 + .2 * Math.sin(t * 2));
    // percolation paths
    const pg = prog(t, 5, 9);
    const dn = [[240, S, 300, 700, 520, 920], [560, S, 520, 700, 700, 900], [1700, S, 1640, 700, 1420, 920], [1380, S, 1440, 700, 1240, 900]];
    ctx.save(); ctx.globalAlpha *= pg; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.setLineDash([22, 18]); ctx.lineDashOffset = -t * 70;
    ctx.strokeStyle = vgrad(S, 920, [[0, '#62c6ff'], [1, '#ff6a2a']]);
    dn.forEach(([a, b, c, d, e, f]) => { ctx.beginPath(); ctx.moveTo(a, b); ctx.quadraticCurveTo(c, d, e, f); ctx.stroke(); });
    ctx.restore();
    const up = prog(t, 12, 15);
    const gx = 700, hx = 1250, mx = 1620;
    ctx.save(); ctx.globalAlpha *= up; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.setLineDash([22, 18]); ctx.lineDashOffset = -t * 90; ctx.strokeStyle = '#ff7a2a';
    ctx.beginPath(); ctx.moveTo(600, 920); ctx.quadraticCurveTo(700, 760, gx, S + 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(1320, 910); ctx.quadraticCurveTo(1250, 700, hx, S + 4); ctx.stroke();
    ctx.restore();
    // geyser chamber + pressure gauge
    const cyc = (t - 15) % 11, erupting = t > 15 && cyc > 7.5;
    const pressure = t < 15 ? prog(t, 12, 15) * .3 : (erupting ? 1 - (cyc - 7.5) / 3.5 : .3 + .7 * cyc / 7.5);
    ctx.fillStyle = '#ff9a3a'; ctx.globalAlpha = up; ctx.beginPath(); ctx.ellipse(gx, 640, 60, 34, 0, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
    ctx.save(); ctx.globalAlpha *= up;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.beginPath(); ctx.roundRect(gx + 100, 560, 36, 180, 10); ctx.fill();
    ctx.fillStyle = pressure > .85 ? '#ff4a2a' : '#ffb03a'; ctx.fillRect(gx + 106, 734 - 168 * pressure, 24, 168 * pressure);
    text('압력', gx + 118, 535, { size: 24 });
    ctx.restore();
    if (erupting) geyser(gx, S, t, Math.sin((cyc - 7.5) / 3.5 * Math.PI) * .75, .55, 160);
    else for (let i = 0; i < 6; i++) { const f = (t * .3 + R(i)) % 1; puff(gx + f * 40, S - f * 120, 30 + f * 50, .3 * (1 - f)); }
    // hot spring
    ctx.fillStyle = '#2b93c2'; ctx.beginPath(); ctx.ellipse(hx, S, 130, 16, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#e69a33'; ctx.lineWidth = 6; ctx.stroke();
    for (let i = 0; i < 10; i++) { const f = (t * .25 + R(i + 20)) % 1; puff(hx + (R(i) - .5) * 200 + f * 60, S - 10 - f * 160, 40 + f * 70, .35 * Math.sin(f * Math.PI)); }
    // mud pot
    ctx.fillStyle = '#8a7a66'; ctx.beginPath(); ctx.ellipse(mx, S, 90, 14, 0, 0, TAU); ctx.fill();
    for (let i = 0; i < 5; i++) { const f = (t * .8 + R(i + 40)) % 1; ctx.strokeStyle = `rgba(90,75,60,${1 - f})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(mx + (R(i + 41) - .5) * 120, S - 4, 6 + f * 18, Math.PI, 0); ctx.stroke(); }

// 7. Will it erupt?
function s7(t) {
  fillRect('#0a0f14');
  ctx.save(); ctx.strokeStyle = 'rgba(80,140,180,.08)'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
  text('옐로스톤 화산 관측소 · 24시간 모니터링', 960, 70, { size: 38, weight: 900, alpha: prog(t, .5, 2) });
  const panel = (x, y, w, h, title, a) => {
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = 'rgba(20,30,40,.85)'; ctx.strokeStyle = 'rgba(120,190,230,.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 16); ctx.fill(); ctx.stroke(); ctx.restore();
    text(title, x + 24, y + 34, { size: 24, align: 'left', color: '#9fd8ff', alpha: a, weight: 700 });
  };
  // seismograph
  const a1 = prog(t, 2, 3.5);
  panel(80, 120, 860, 360, '지진계 · 땅의 떨림', a1);
  ctx.save(); ctx.globalAlpha = a1; ctx.beginPath(); ctx.rect(100, 170, 820, 290); ctx.clip();
  ctx.strokeStyle = '#7dffb0'; ctx.lineWidth = 2; ctx.beginPath();
  for (let x = 100; x <= 920; x += 3) {
    const k = (x - 100) / 3 + Math.floor(t * 40);
    const burst = R(Math.floor(k / 60)) > .8 ? 1 : 0;
    const amp = 8 + burst * 70 * Math.exp(-((k % 60) / 14));
    const y = 315 + (R(k) - .5) * amp * 2;
    x === 100 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke(); ctx.restore();
  // GPS map
  const a2 = prog(t, 4, 5.5);
  panel(980, 120, 860, 360, 'GPS · 땅의 오르내림', a2);
  ctx.save(); ctx.globalAlpha = a2;
  blobPath(1410, 310, 150, 3, .1, .65); ctx.strokeStyle = '#ffb35a'; ctx.setLineDash([10, 8]); ctx.lineWidth = 3; ctx.stroke(); ctx.setLineDash([]);
  text('칼데라 경계', 1410, 220, { size: 20, weight: 500, color: '#ffb35a' });
  for (let i = 0; i < 12; i++) {
    const x = 1070 + R(i + 5) * 680, y = 190 + R(i + 6) * 250, d = Math.sin(t * .8 + i) * 18;
    ctx.fillStyle = '#9fd8ff'; ctx.beginPath(); ctx.arc(x, y, 7, 0, TAU); ctx.fill();
    ctx.strokeStyle = d > 0 ? '#7dffb0' : '#ff8a6a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - d); ctx.stroke();
  }
  ctx.restore();
  // magma reservoir sponge
  const a3 = prog(t, 9, 10.5);
  panel(80, 510, 860, 350, '지하 마그마 저장소', a3);
  ctx.save(); ctx.globalAlpha = a3;
  ctx.save(); blobPath(510, 690, 250, 2, .07, .46); ctx.fillStyle = '#4a3a34'; ctx.fill(); ctx.clip();
  for (let i = 0; i < 160; i++) { ctx.fillStyle = `rgba(${90 + R(i) * 40 | 0},${70 + R(i) * 30 | 0},${60 + R(i) * 30 | 0},1)`; ctx.beginPath(); ctx.arc(250 + R(i + 1) * 520, 570 + R(i + 2) * 240, 10 + R(i + 3) * 18, 0, TAU); ctx.fill(); }
  const melt = prog(t, 11, 14);
  for (let i = 0; i < 26; i++) glow(280 + R(i + 300) * 460, 620 + R(i + 301) * 150, 22 * melt, 'rgba(255,120,30,.95)', .7 + .3 * Math.sin(t * 3 + i));
  ctx.restore();
  text('대부분 굳은 결정', 300, 835, { size: 24, weight: 500, color: '#d8ccc4', alpha: prog(t, 11, 12) });
  text('녹아 있는 부분 · 약 5~15%', 720, 835, { size: 24, weight: 700, color: '#ffb35a', alpha: prog(t, 12.5, 14) });
  ctx.restore();
  // USGS gauge
  const a4 = prog(t, 16, 17.5);
  panel(980, 510, 860, 350, '미국지질조사국(USGS) 평가', a4);
  ctx.save(); ctx.globalAlpha = a4;
  const gx = 1410, gy = 820, gr = 160;
  const segs = ['#3fbf7f', '#c9cf3f', '#ff9a3a', '#ff4a2a'];
  segs.forEach((c, i) => { ctx.strokeStyle = c; ctx.lineWidth = 36; ctx.beginPath(); ctx.arc(gx, gy, gr, Math.PI + i * Math.PI / 4 + .02, Math.PI + (i + 1) * Math.PI / 4 - .02); ctx.stroke(); });
  const needle = Math.PI + lerp(Math.PI * .9, Math.PI * .1, easeOut(prog(t, 17, 20)));
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + Math.cos(needle) * (gr - 30), gy + Math.sin(needle) * (gr - 30)); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(gx, gy, 12, 0, TAU); ctx.fill();
  ctx.restore();
  text('가까운 미래 초거대 분화 가능성', 1410, 580, { size: 28, weight: 500, alpha: a4 });
  text('매우 낮음', 1410, 770, { size: 52, weight: 900, color: '#7dffb0', alpha: prog(t, 19.5, 21) });
  // final
  const fa = win(t, 30, 40.5);
  if (fa > 0) {
    ctx.save(); ctx.globalAlpha = fa * .85; fillRect('#05080b'); ctx.restore();
    glow(960, 560, 380, 'rgba(255,100,30,.5)', fa * (.7 + .3 * Math.sin(t * 2.5)));
    text('그래도, 옐로스톤은', 960, 470, { size: 50, weight: 500, alpha: fa });
    text('여전히 살아 있는 화산', 960, 570, { size: 80, weight: 900, color: '#ffb35a', alpha: fa });
  }
}

    '옐로스톤은 지구가 지금도 움직이고 있다는 것을 가장 생생하게 보여주는 장소입니다.',
    '다음에 옐로스톤의 사진을 보게 된다면 그 아래에서 숨 쉬고 있는 거대한 불의 심장을 한번 떠올려 보세요.'],
    times: [1, 12.5, 21, 28] },
];
const CUES = [];
SCENES.forEach((s, si) => {
  let times = s.times;
  if (!times) {
    const a = s.start + 1, b = s.end - 1, w = s.lines.map(l => l.length + 10), sum = w.reduce((x, y) => x + y, 0);
    let acc = a; times = [];
    s.lines.forEach((l, i) => { times.push(acc - s.start); acc += (b - a) * w[i] / sum; });
    times.push(b - s.start);
  }
  s.lines.forEach((l, i) => CUES.push({ start: s.start + times[i], end: s.start + times[i + 1], text: l, scene: si }));
});

/* ---------- frame ---------- */
let showCC = true;
function wrap(str, maxW) {
  const words = str.split(' '), lines = []; let cur = '';
  words.forEach(w => { const test = cur ? cur + ' ' + w : w; if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; });
  if (cur) lines.push(cur); return lines;
}
function subtitles(T) {
  const c = CUES.find(c => T >= c.start && T < c.end);
  if (!c || !showCC) return;
  const a = win(T, c.start, c.end, .25);
  ctx.save(); ctx.font = `500 40px ${FONT}`;
  const lines = wrap(c.text, 1500), lh = 56, h = lines.length * lh + 28;
  const wmax = Math.max(...lines.map(l => ctx.measureText(l).width)) + 60;
  const y0 = H - 50 - h;
  ctx.globalAlpha = a * .72; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.roundRect(W / 2 - wmax / 2, y0, wmax, h, 14); ctx.fill();
  ctx.globalAlpha = a; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, y0 + 14 + lh / 2 + i * lh));
  ctx.restore();
}
function chapter(T, s, i) {
  const lt = T - s.start, a = win(lt, .8, 7, .8);
  if (a <= 0 || i === 0) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = '#ff8a2a'; ctx.fillRect(60, 46, 6, 64);
  text(String(i + 1).padStart(2, '0'), 86, 64, { size: 26, align: 'left', color: '#ffb36b' });
  text(s.title, 86, 98, { size: 34, align: 'left', weight: 900 });
  ctx.restore();
}
function renderFrame(T) {
  T = clamp(T, 0, TOTAL - .001);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  fillRect('#000');
  const si = SCENES.findIndex(s => T >= s.start && T < s.end), s = SCENES[si];
  ctx.save(); s.draw(T - s.start); ctx.restore();
  // scene boundary dip
  const lt = T - s.start, d = s.end - s.start, f = .5;
  const dip = Math.max(si > 0 ? 1 - lt / f : 0, si < SCENES.length - 1 ? 1 - (d - lt) / f : 0);
  if (dip > 0) { ctx.globalAlpha = clamp(dip); fillRect('#000'); ctx.globalAlpha = 1; }
  chapter(T, s, si);
  subtitles(T);
  ctx.restore();
  return si;
}
window.renderFrame = renderFrame;
window.TOTAL = TOTAL;

/* ---------- player ---------- */
const isRender = new URLSearchParams(location.search).has('render');
if (isRender) document.body.classList.add('render');
const $ = id => document.getElementById(id);
let playing = false, T = 0, last = 0, lastCue = null, tts = false;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const chapBox = $('chapters');
SCENES.forEach((s, i) => { const b = document.createElement('button'); b.textContent = `${i + 1}. ${s.title}`; b.onclick = () => { seek(s.start); }; chapBox.appendChild(b); });
function ui(si) {
  $('time').textContent = `${fmt(T)} / ${fmt(TOTAL)}`;
  $('seek').value = T;
  [...chapBox.children].forEach((b, i) => b.classList.toggle('on', i === si));
}
function speak(T) {
  if (!tts || !('speechSynthesis' in window)) return;
  const c = CUES.find(c => T >= c.start && T < c.end);
  if (c && c !== lastCue) {
    lastCue = c; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(c.text); u.lang = 'ko-KR'; u.rate = 1.05; speechSynthesis.speak(u);
  }
}
function tick(now) {
  if (playing) { T += (now - last) / 1000; if (T >= TOTAL) { T = TOTAL; setPlaying(false); } }
  last = now;
  const si = renderFrame(T); ui(si); if (playing) speak(T);
  requestAnimationFrame(tick);
}
function setPlaying(p) {
  playing = p; if (p && T >= TOTAL - .01) T = 0;
  $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('bigplay').hidden = p;
  if (!p && 'speechSynthesis' in window) speechSynthesis.cancel();
  lastCue = null;
}
function seek(t) { T = clamp(+t, 0, TOTAL); lastCue = null; if ('speechSynthesis' in window) speechSynthesis.cancel(); }
if (!isRender) {
  $('play').onclick = $('bigplay').onclick = () => setPlaying(!playing);
  $('seek').oninput = e => seek(e.target.value);
  $('cc').onclick = e => { showCC = !showCC; e.target.setAttribute('aria-pressed', showCC); };
  $('tts').onclick = e => { tts = !tts; e.target.setAttribute('aria-pressed', tts); lastCue = null; if (!tts && 'speechSynthesis' in window) speechSynthesis.cancel(); };
  $('fs').onclick = () => { const st = document.querySelector('.stage'); document.fullscreenElement ? document.exitFullscreen() : st.requestFullscreen?.(); };
  document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); } if (e.code === 'ArrowRight') seek(T + 5); if (e.code === 'ArrowLeft') seek(T - 5); });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(t => { last = t; tick(t); }));
}
</script>
</body>
</html>
